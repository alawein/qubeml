name: drift

on:
  pull_request:
    paths-ignore:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.svg'
      - '**/*.gif'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run drift detectors
        uses: alawein/repo-drift@c9937d8df883da3f1561361e7b006201d380f07b # v0.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
